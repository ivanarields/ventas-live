<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff2d78" />
  <link rel="manifest" href="/manifest-tienda.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" href="/icon-192.png" />
  <title>Tienda Leydi American</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#fdf5f7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:16px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
  <link rel="preconnect" href="https://thgbfurscfjcmgokyyif.supabase.co" />
  <link rel="dns-prefetch" href="https://thgbfurscfjcmgokyyif.supabase.co" />
  <script>
    // Limpieza activa: si hay un SW viejo registrado, lo desregistramos y limpiamos cache.
    // El SW de tienda-v2 ahora es kill-switch y se autodestruye, pero forzamos aqui tambien
    // por si el navegador todavia no ha activado la nueva version.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
      if (window.caches) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
      }
    }
  </script>
</head>
<body>
  <div id="root">
    <div style="max-width:430px;margin:0 auto;background:#fff;min-height:100vh;padding:20px">
      <div style="height:60px;border-radius:12px;margin-bottom:16px" class="skeleton"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div style="aspect-ratio:3/4" class="skeleton"></div>
        <div style="aspect-ratio:3/4" class="skeleton"></div>
        <div style="aspect-ratio:3/4" class="skeleton"></div>
        <div style="aspect-ratio:3/4" class="skeleton"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/storefront-v2/main.tsx"></script>
</body>
</html>
